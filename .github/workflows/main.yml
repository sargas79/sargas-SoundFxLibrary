name: Release Creation

# Runs when a version tag (e.g. v1.1.0) is pushed. The workflow creates the
# GitHub release, generates release notes and attaches module.json and
# module.zip. To cut a release:
#   git tag v1.2.0 && git push origin v1.2.0
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    # Strip the leading "v" from the tag to get the module version
    - name: Extract tag version number
      id: get_version
      run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

    # Substitute the Manifest and Download URLs in the module.json
    - name: Substitute Manifest and Download Links For Versioned Ones
      id: sub_manifest_link_version
      uses: microsoft/variable-substitution@v1
      with:
        files: 'module.json'
      env:
        version: ${{ steps.get_version.outputs.version }}
        url: https://github.com/${{ github.repository }}
        manifest: https://github.com/${{ github.repository }}/releases/latest/download/module.json
        download: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/module.zip

    # Create a zip file with all files required by the module to add to the release
    - run: zip -r ./module.zip packRegistry.js module.json LICENSE README.md changelog.md Attribution.xlsx img/ Combat/ Creatures/ Misc/ Nature/ Tavern/ Town/ lang/

    # Create the release for this tag and attach the artifacts
    - name: Create Release with Files
      id: create_version_release
      uses: ncipollo/release-action@v1
      with:
        allowUpdates: true
        generateReleaseNotes: true
        name: ${{ github.ref_name }}
        tag: ${{ github.ref_name }}
        token: ${{ secrets.GITHUB_TOKEN }}
        artifacts: './module.json, ./module.zip'
